name: AdMob Full Sync to BigQuery

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days to sync (default: 2)'
        required: false
        default: '2'
      backfill_start:
        description: 'Backfill start date (YYYY-MM-DD)'
        required: false
      backfill_end:
        description: 'Backfill end date (YYYY-MM-DD)'
        required: false
      chunk_days:
        description: 'Days per chunk for backfill (default: 7)'
        required: false
        default: '7'
      enable_campaign_beta:
        description: 'Enable optional AdMob v1beta campaign report'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-cloud-bigquery

      - name: Run AdMob Full Sync
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          BQ_DATASET_ID: ${{ secrets.BQ_DATASET_ID }}
          BQ_LOCATION: ${{ secrets.BQ_LOCATION }}
          ADMOB_PUBLISHER_ID: ${{ secrets.ADMOB_PUBLISHER_ID }}
          ADMOB_REPORT_CURRENCY: ${{ secrets.ADMOB_REPORT_CURRENCY }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          ENABLE_ADMOB_BETA_CAMPAIGN: ${{ secrets.ENABLE_ADMOB_BETA_CAMPAIGN }}
        run: |
          ENABLE_FLAG=""
          if [ "${{ github.event.inputs.enable_campaign_beta }}" = "true" ]; then
            ENABLE_FLAG="--enable-campaign-beta"
          fi

          if [ -n "${{ github.event.inputs.backfill_start }}" ] && [ -n "${{ github.event.inputs.backfill_end }}" ]; then
            python src/admob_full_sync.py \
              --backfill-start "${{ github.event.inputs.backfill_start }}" \
              --backfill-end "${{ github.event.inputs.backfill_end }}" \
              --chunk-days "${{ github.event.inputs.chunk_days || '7' }}" \
              $ENABLE_FLAG
          else
            python src/admob_full_sync.py \
              --days "${{ github.event.inputs.days_back || '2' }}" \
              $ENABLE_FLAG
          fi
