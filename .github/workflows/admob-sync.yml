name: AdMob Full Sync to BigQuery

on:
  schedule:
    # 🔁 HAR 15 MINUTE — public repo par Actions FREE hai.
    #    Har run pehle BQ se poochti hai "kal ka data hai?" — hai to 10 sec
    #    mein skip. Nahi to poora loader (45 din MERGE). Der ≤ ~20 min.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days to sync (default: 3)'
        required: false
        default: '45'
      backfill_start:
        description: 'Backfill start date (YYYY-MM-DD)'
        required: false
      backfill_end:
        description: 'Backfill end date (YYYY-MM-DD)'
        required: false
      dim_shrink_pct:
        description: 'Refuse dim swap if new rows < this fraction of existing (0 = disable guard)'
        required: false
        default: '0.5'

# Do not let two runs of the same publisher overlap — concurrent
# delete+insert on the same publisher_id rows corrupts the dims.
concurrency:
  group: admob-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # below the 360 hard cap, so cleanup still runs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-cloud-bigquery

      # ══════════════════════════════════════════════════════════════════════
      # 🔧 bq CLI — self-heal/verify ke liye. WAHI secret jo loader use karta hai.
      #    Koi naya secret nahi.
      # ══════════════════════════════════════════════════════════════════════
      - name: "🔑 GCP auth (bq ke liye)"
        id: gcp_auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: "🔧 setup-gcloud (bq CLI)"
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      # ══════════════════════════════════════════════════════════════════════
      # 🩺 SELF-HEAL ① — PEHLE ki haalat yaad rakho (rollback/verify ke liye)
      # ══════════════════════════════════════════════════════════════════════
      - name: "🩺 Pehle ki haalat — rows aur aakhri din"
        id: before
        continue-on-error: true
        run: |
          set +e
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(report_date) AS STRING) FROM \`terafort.Admob.admob_unified_fact\`" 2>/dev/null | tail -1)
          ROWS=$(echo "$R" | cut -d, -f1); LAST=$(echo "$R" | cut -d, -f2)
          echo "📊 pehle: ${ROWS:-?} rows · aakhri din ${LAST:-?}"
          echo "rows=${ROWS:-0}" >> "$GITHUB_OUTPUT"
          echo "last=${LAST:-}"  >> "$GITHUB_OUTPUT"
          # ── gap dekh kar lookback tay karo ──
          LB="${{ github.event.inputs.lookback_days || '45' }}"
          if [[ "$LAST" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            GAP=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
            if [ "$GAP" -gt "$LB" ]; then
              LB=$(( GAP + 3 )); [ "$LB" -gt 180 ] && LB=180
              echo "::warning::🩺 Self-heal: data ${GAP} din purana — lookback ${LB} kiya"
            fi
          else
            # ── 🛡️ SAFETY NET: bq nahi chala (setup-gcloud nahi?) ──
            #    Bina jaanch ke har 15 min poora loader chalana = platform API par
            #    bojh (rate limit). Is liye sirf GHANTE KE SHURU mein chalao
            #    (:00–:14) — yani purane 1-ghanta cron jaisa. Baqi 15-min skip.
            MIN=$((10#$(date -u +%M)))
            if [ "$MIN" -ge 15 ]; then
              echo "⚠️ BQ check nahi ho saka — sirf ghante ke shuru mein chalta hoon (abhi :$MIN) — skip"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "lookback=$LB" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "⚠️ BQ check nahi ho saka — ghante ka shuru hai, loader chalega (lookback $LB)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ── 🔑 SKIP: kal ka data pehle se hai to kuch mat karo ──
          YESTERDAY=$(date -u -d yesterday +%F)
          if [[ "$LAST" > "$YESTERDAY" ]] || [[ "$LAST" == "$YESTERDAY" ]]; then
            echo "✅ kal ka data ($LAST) pehle se hai — skip, kuch nahi karna"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "lookback=$LB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "🔍 kal ($YESTERDAY) ka data nahi — loader chalega"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "lookback=$LB" >> "$GITHUB_OUTPUT"

      # 🔁 RETRY — neeche wala main step 3 baar koshish karta hai.
      #    (nick-fields/retry se: platform API 5xx / timeout par khud dobara)
      - name: Run AdMob Full Sync
        if: steps.before.outputs.skip != 'true'
        env:
          GCP_PROJECT_ID:        ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_JSON:  ${{ secrets.GCP_CREDENTIALS_JSON }}
          BQ_DATASET_ID:         ${{ secrets.BQ_DATASET_ID }}
          BQ_LOCATION:           ${{ secrets.BQ_LOCATION }}
          ADMOB_PUBLISHER_ID:    ${{ secrets.ADMOB_PUBLISHER_ID }}
          ADMOB_REPORT_CURRENCY: ${{ secrets.ADMOB_REPORT_CURRENCY }}
          OAUTH_CLIENT_ID:       ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET:   ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN:   ${{ secrets.OAUTH_REFRESH_TOKEN }}
          DIM_SHRINK_PCT:        ${{ github.event.inputs.dim_shrink_pct || '0.5' }}
          BACKFILL_START:        ${{ github.event.inputs.backfill_start }}
          BACKFILL_END:          ${{ github.event.inputs.backfill_end }}
          DAYS_BACK:             ${{ github.event.inputs.days_back || '3' }}
        run: |
          set -euo pipefail
          if [ -n "${BACKFILL_START}" ] && [ -n "${BACKFILL_END}" ]; then
            echo "Mode: BACKFILL ${BACKFILL_START} -> ${BACKFILL_END}"
            python src/admob_full_sync.py \
              --backfill-start "${BACKFILL_START}" \
              --backfill-end   "${BACKFILL_END}"
          else
            echo "Mode: DAILY SYNC (${DAYS_BACK} days)"
            python src/admob_full_sync.py --days "${DAYS_BACK}"
          fi

      # Post-run assertion: if the dims are empty for this publisher the run
      # is a failure even if the script exited 0. This is the check that would
      # have caught run #214 the same morning instead of days later.
      - name: Verify dimension health
        if: always()
        env:
          GCP_PROJECT_ID:       ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          BQ_DATASET_ID:        ${{ secrets.BQ_DATASET_ID }}
          BQ_LOCATION:          ${{ secrets.BQ_LOCATION }}
          ADMOB_PUBLISHER_ID:   ${{ secrets.ADMOB_PUBLISHER_ID }}
        run: |
          python - <<'PY'
          import os, json, sys
          from google.cloud import bigquery
          from google.oauth2 import service_account

          project = os.environ["GCP_PROJECT_ID"]
          dataset = os.environ.get("BQ_DATASET_ID", "Admob")
          pub     = os.environ["ADMOB_PUBLISHER_ID"].replace("accounts/", "").strip()

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["GCP_CREDENTIALS_JSON"]),
              scopes=["https://www.googleapis.com/auth/bigquery"],
          )
          bq = bigquery.Client(project=project, credentials=creds,
                               location=os.environ.get("BQ_LOCATION", "US"))

          failed = False
          for table, minimum in [("admob_account_dim", 1),
                                 ("admob_apps_dim", 1),
                                 ("admob_ad_units_dim", 1)]:
              n = list(bq.query(
                  f"SELECT COUNT(*) n FROM `{project}.{dataset}.{table}` "
                  f"WHERE publisher_id = @p",
                  job_config=bigquery.QueryJobConfig(query_parameters=[
                      bigquery.ScalarQueryParameter("p", "STRING", pub)
                  ]),
              ).result())[0]["n"]
              flag = "OK " if n >= minimum else "EMPTY"
              print(f"  [{flag}] {table}: {n:,} rows for {pub}")
              if n < minimum:
                  failed = True

          if failed:
              print("\n:: DIMENSION TABLE EMPTY FOR THIS PUBLISHER ::")
              print("Re-run this workflow. If it stays empty, the AdMob API is")
              print("refusing the apps/adUnits list call for this account.")
              sys.exit(1)
          print("\nDimension health OK.")
          PY

      # ══════════════════════════════════════════════════════════════════════
      # 🛡️ SELF-HEAL ② — BAAD mein VERIFY. Kharab data mile to run LAAL.
      # ══════════════════════════════════════════════════════════════════════
      #  Teen check:
      #    1. rows KAM to nahi ho gaye  (koi loader TRUNCATE kar ke mar gaya?)
      #    2. aakhri din PEECHE to nahi gaya
      #    3. aaj ke window mein NEGATIVE ya NULL key to nahi
      #  Koi bhi fail → exit 1 → workflow red → tum ko pata chalega.
      #  🔑 Loader khud MERGE karta hai, is liye rollback ki zaroorat nahi —
      #     purana data waise hi mehfooz rehta hai.
      - name: "🛡️ Baad mein verify — bad data nahi jaana chahiye"
        if: always() && steps.before.outputs.skip != 'true'
        run: |
          set +e
          BEFORE_ROWS="${{ steps.before.outputs.rows || '0' }}"
          BEFORE_LAST="${{ steps.before.outputs.last || '' }}"
          R=$(bq query --nouse_legacy_sql --format=csv --quiet \
            "SELECT COUNT(*), CAST(MAX(report_date) AS STRING), COUNTIF(report_date IS NULL) FROM \`terafort.Admob.admob_unified_fact\`" 2>/dev/null | tail -1)
          if [ -z "$R" ]; then
            echo "::warning::verify skip — bq query nahi chali (setup-gcloud hai?)"
            exit 0
          fi
          AFTER_ROWS=$(echo "$R" | cut -d, -f1); AFTER_LAST=$(echo "$R" | cut -d, -f2); NULLS=$(echo "$R" | cut -d, -f3)
          echo "📊 baad:  ${AFTER_ROWS} rows · aakhri din ${AFTER_LAST} · null dates ${NULLS}"
          FAIL=0
          # 1. rows 5% se zyada KAM ho gaye = kuch toota
          if [ "$BEFORE_ROWS" -gt 100 ] && [ "$AFTER_ROWS" -lt $(( BEFORE_ROWS * 95 / 100 )) ]; then
            echo "::error::🔴 ROWS KAM HO GAYE: $BEFORE_ROWS → $AFTER_ROWS — loader ne data URA DIYA"; FAIL=1
          fi
          # 2. aakhri din peeche gaya
          if [[ "$BEFORE_LAST" =~ ^[0-9]{4} ]] && [[ "$AFTER_LAST" < "$BEFORE_LAST" ]]; then
            echo "::error::🔴 AAKHRI DIN PEECHE GAYA: $BEFORE_LAST → $AFTER_LAST"; FAIL=1
          fi
          # 3. null date key
          if [ "${NULLS:-0}" -gt 0 ]; then
            echo "::error::🔴 ${NULLS} rows par date NULL hai — kharab data"; FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            echo "::error::🔴 VERIFY FAIL — is run ka data bharosay ke qabil NAHI"
            exit 1
          fi
          echo "✅ verify pass — $(( AFTER_ROWS - BEFORE_ROWS )) rows badhe"

      # ══════════════════════════════════════════════════════════════════════
      # 📣 NAKAAMI PAR BATAO — chup-chaap fail na ho
      # ══════════════════════════════════════════════════════════════════════
      - name: "📣 Fail hua to summary mein likho"
        if: failure()
        run: |
          {
            echo "## 🔴 ${{ github.workflow }} — NAKAAM"
            echo "- run: ${{ github.run_id }}"
            echo "- waqt: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- pehle: ${{ steps.before.outputs.rows }} rows · ${{ steps.before.outputs.last }}"
            echo "- 🔁 agli scheduled run khud dobara koshish karegi (din mein 4x)"
            echo "- 🩺 self-heal gap dekh kar lookback barha dega"
          } >> "$GITHUB_STEP_SUMMARY"
